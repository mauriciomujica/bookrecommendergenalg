<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendador Musketeers</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" href="./assets/img/icon.ico">


</head>
<body>
    <div class = "banner" id="home">
        <div class = "navbar">
            <div class = "icono">
                <a href="index.html"><img src="./assets/img/logo.png" alt="Logo Empresa"></a>
                <a href="index.html"><span title="Recomendador amigo">Musketeers</span></a>
            </div>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./pages/nosotros.html">Nosotros</a></li>
                <li><a href="./pages/contact.html">Contacto</a></li>
            </ul>
        </div>
    </div>
    <div id="welcome-section" style="text-align: center; margin: 50px;">
        <h1>Bienvenido/a, ingrese su numero de usuario</h1>
        <form id="welcome-form">
            <input type="text" id="user-id" placeholder="Número de usuario" required>
            <button type="submit">Continuar</button>
        </form>
    </div>
    <div id="main-buttons" style="text-align: center; margin: 20px; display: none;">
        <button class="main-nav-btn" id="dataset-button">Dataset</button>
        <button class="main-nav-btn" id="chatbot-button">Chatbot</button>
    </div>

    <div id="dataset-section" style="display: none; position: relative; min-height: calc(100vh - 200px);">
        <!-- Placeholder for Dataset content -->
        <div style="text-align: center; margin: 20px;">
            <button class="main-nav-btn" id="back-button">Volver al inicio</button>
        </div>
        <div id="dataset-results" style="margin-top: 20px; text-align: center;">
            <!-- Results will be displayed here -->
        </div>
        <div id="loading-container" class="loading-container" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Cargando libros...</p>
        </div>
        <div id="dataset-selection" style="margin-top: 10px; text-align: center;"></div>
        <div id="progress-container" style="display: none; margin: 20px auto; max-width: 400px;">
            <div id="progress-bar" style="width: 100%; background-color: #f0f0f0; border-radius: 10px; overflow: hidden;">
                <div id="progress-fill" style="width: 0%; height: 20px; background-color: #2d6cdf; transition: width 0.3s ease;"></div>
            </div>
            <p id="progress-text" style="text-align: center; margin-top: 10px;">Procesando...</p>
        </div>
    </div>

    <div id="chatbot-section" style="display: none; position: relative; min-height: calc(100vh - 200px);">
        <div id="chat-output">
        <div class="asistente">¡Hola! Soy tu asistente de recomendación de lecturas. ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div id="chat-options" class="chat-options-inline">
            <button class="option-btn" id="estado-pedido">Estado del pedido</button>
            <button class="option-btn" id="locales-cercanos">Locales más cercanos</button>
            <button class="option-btn" id="soporte">Soporte</button>
            <button class="option-btn" id="inventario">Inventario</button>
            <button class="option-btn" id="toggle-gemini">Gemini</button>
        </div>
        <div id="sub-options" style="display: none; text-align: center; margin: 10px 0;">
            <!-- Sub-options will be inserted here dynamically -->
        </div>
        <div id="search-input-container" style="display: none; text-align: center; margin: 10px 0;">
            <input type="text" id="search-input" placeholder="Escribe aquí..." list="search-list">
            <datalist id="search-list"></datalist>
            <button id="search-btn">Buscar</button>
        </div>
        <div id="item-options" style="display: none; text-align: center; margin: 10px 0;">
            <!-- Item-specific options will be inserted here -->
        </div>
        <div id="gemini-section" style="display: none; text-align: center; margin: 20px 0;">
            <textarea id="mensaje" name="mensaje" placeholder="  Deja aquí tu mensaje o consulta"></textarea>
            <div class="error" id="errorMensaje"></div>
            <button id="enviarMensaje">Enviar</button>
        </div>
        </div>

    </div>
        
    </div>

    <script src="/js/chatbot.js"></script>
</body>
</html>
