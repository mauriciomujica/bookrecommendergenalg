<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Recomendador Musketeers</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" href="./assets/img/icon.ico">
</head>
<body>
    <header class="navbar">
        <div class="icono">
            <a href="index.html"><img src="./assets/img/logo.png" alt="Logo Musketeers"></a>
            <a href="index.html"><span>Musketeers</span></a>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./pages/nosotros.html">Nosotros</a></li>
                <li><a href="./pages/contact.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <div id="chatbot-section" style="display: block; position: relative; min-height: calc(100vh - 200px); margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px;"><h2>Chatbot</h2><button class="btn-accent" onclick="const params = new URLSearchParams(window.location.search); const uid = params.get('user_id'); window.location.href='dataset.html?user_id=' + uid;">Volver al Dataset</button></div>
        <div id="chat-output">
            <div class="asistente">¡Hola! Soy tu asistente de recomendación de lecturas. ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div id="chat-options" class="chat-options-inline">
            <button class="option-btn" id="estado-pedido">Estado del pedido</button>
            <button class="option-btn" id="locales-cercanos">Locales más cercanos</button>
            <button class="option-btn" id="soporte">Soporte</button>
            <button class="option-btn" id="inventario">Inventario</button>
            <button class="option-btn" id="toggle-gemini">Gemini</button>
        </div>
        <div id="sub-options" style="display: none; text-align: center; margin: 10px 0;">
            <!-- Sub-options will be inserted here dynamically -->
        </div>
        <div id="search-input-container" style="display: none; text-align: center; margin: 10px 0;">
            <label class="search-label">
                <svg viewBox="0 0 512 512" aria-hidden="true" class="search-icon" width="20">
                    <path d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6.1-34zM208 336c-70.7 0-128-57.2-128-128 0-70.7 57.2-128 128-128 70.7 0 128 57.2 128 128 0 70.7-57.2 128-128 128z"/>
                </svg>
                <input type="text" id="search-input" placeholder="Escribe aquí..." list="search-list" class="search-input">
            </label>
            <datalist id="search-list"></datalist>
        </div>
        <div id="item-options" style="display: none; text-align: center; margin: 10px 0;">
            <!-- Item-specific options will be inserted here -->
        </div>
        <div id="rating-section" style="display: none; text-align: center; margin: 10px 0;">
            <p>¿Cuánto te gustó este libro? (1-10)</p>
            <div id="rating-options" style="margin: 10px 0;">
                <!-- Radio buttons will be inserted here -->
            </div>
            <button id="submit-rating" class="btn-accent" style="margin-top: 10px;">Enviar</button>
        </div>
        <div id="gemini-section" style="display: none; text-align: center; margin: 20px 0;">
            <textarea id="mensaje" name="mensaje" placeholder="  Deja aquí tu mensaje o consulta"></textarea>
            <div class="error" id="errorMensaje"></div>
            <button id="enviarMensaje">Enviar</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        if (userId) {
            currentUserId = userId;
        }
    </script>
    <script src="/js/chatbot.js"></script>
</body>
</html>
