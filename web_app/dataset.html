<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset - Recomendador Musketeers</title>
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="icon" href="./assets/img/icon.ico">
</head>
<body>
    <header class="navbar">
        <div class="icono">
            <a href="index.html"><img src="./assets/img/logo.png" alt="Logo Musketeers"></a>
            <a href="index.html"><span>Musketeers</span></a>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./pages/nosotros.html">Nosotros</a></li>
                <li><a href="./pages/contact.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <div id="welcome-section" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <form class="login-form" id="welcome-form" action="javascript:void(0);">
            <h1>Login</h1>
            <div class="form-input-material">
                <input type="text" id="user-id" placeholder=" " autocomplete="off" class="form-control-material" required />
                <label for="user-id">Número de usuario</label>
            </div>
            <button type="submit" class="btn btn-primary btn-ghost">Continuar</button>
        </form>
    </div>

    <div id="dataset-section" style="display: none; position: relative; min-height: calc(100vh - 200px); margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px;">
            <h2>Dataset</h2>
            <button class="btn-accent" onclick="document.getElementById('welcome-section').style.display='flex'; document.getElementById('dataset-section').style.display='none';">Volver al formulario</button>
        </div>
        <div id="dataset-results" style="margin-top: 20px; text-align: center;">
            <!-- Results will be displayed here -->
        </div>
        <div id="loading-container" class="loading-container" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Cargando libros...</p>
        </div>
        <div id="dataset-selection" style="margin-top: 10px; text-align: center;"></div>
        <div id="progress-container" style="display: none; margin: 20px auto; max-width: 400px;">
            <div id="progress-bar" style="width: 100%; background-color: #f0f0f0; border-radius: 10px; overflow: hidden;">
                <div id="progress-fill" style="width: 0%; height: 20px; background-color: #2d6cdf; transition: width 0.3s ease;"></div>
            </div>
            <p id="progress-text" style="text-align: center; margin-top: 10px;">Procesando...</p>
        </div>
    </div>

    <script src="/js/chatbot.js"></script>
</body>
</html>
